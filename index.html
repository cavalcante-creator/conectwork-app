<link rel="stylesheet" href="css/app.css">
<script>/* tema escolhido pela pessoa (claro, escuro ou automático), aplicado antes de desenhar a tela */
try { var t = localStorage.getItem('cw.tema'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>

<div id="app"><div class="carregando"><div class="box"><div class="giro"></div><span>Carregando o Conectwork…</span></div></div></div>
