<!doctype html>
<html lang="pt-BR" class="entrada">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081638">
<meta name="description" content="Conectwork: conectando empresas, pessoas e oportunidades. Toda papelada e burocracia em um só lugar, na palma da sua mão.">
<title>Conectwork</title>
<!-- app instalável (manifest e ícones) e iPhone -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conectwork">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>/* tema: escuro por padrão; a pessoa pode escolher claro ou automático (segue o aparelho). Aplicado antes de desenhar a tela */
(function () { var t = null; try { t = localStorage.getItem('cw.tema'); } catch (e) {}
  if (t === 'light') document.documentElement.dataset.theme = 'light'; else if (t !== 'auto') document.documentElement.dataset.theme = 'dark'; })();</script>
</head>
<body>
<!-- abertura: o símbolo se desenha, a folha entra e o nome aparece (só na primeira abertura da sessão; respeita "reduzir movimento") -->
<div id="abertura" aria-hidden="true">
  <div class="ab-c">
    <svg class="ab-sim" viewBox="0 0 100 100" width="112" height="112">
      <defs><linearGradient id="aba" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B7BFF"/><stop offset="1" stop-color="#1A5CF0"/></linearGradient>
        <linearGradient id="abb" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0A4C8A"/><stop offset=".5" stop-color="#0FA394"/><stop offset="1" stop-color="#24DFB3"/></linearGradient></defs>
      <path class="ab-faixa" pathLength="100" d="M70.5 40.1 61.3 30.9Q50 19.6 38.7 30.9L30.9 38.7Q19.6 50 30.9 61.3L38.7 69.1Q50 80.4 61.3 69.1L63.5 66.9" fill="none" stroke="url(#aba)" stroke-width="21"/>
      <path class="ab-folha" d="M49.6 66 71 44.6Q74 41.6 78.5 41.2L85.5 40.7Q88.6 40.5 88.4 43.6L87.9 50.6Q87.6 54.8 84.8 57.6L64.4 80.8Z" fill="url(#abb)"/>
    </svg>
    <div class="ab-nome">Conect<b>work</b></div>
    <div class="ab-frase">Conectando empresas, pessoas e oportunidades.</div>
  </div>
</div>
<script>/* tira a abertura depois da animação; não bloqueia nada (pointer-events: none) */
(function () { var a = document.getElementById('abertura'), ja = false;
  try { ja = sessionStorage.getItem('cw.abertura') === '1'; sessionStorage.setItem('cw.abertura', '1'); } catch (e) {}
  var calmo = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (ja || calmo || /[?&]semAbertura/.test(location.search)) { a.remove(); return; }
  setTimeout(function () { a.classList.add('sai'); }, 2050);
  setTimeout(function () { a.remove(); }, 2550);
})();</script>
<div id="app"><div class="carregando"><div class="box"><div class="giro"></div><span>Carregando o Conectwork…</span></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="offline" id="offline" role="status" aria-live="polite" hidden>Você está offline. Nada é enviado ao servidor até a conexão voltar.</div>
<noscript><p style="padding:24px">O Conectwork precisa do JavaScript ligado no navegador.</p></noscript>

<!-- Firebase pela CDN oficial, versão fixa (mesma do painel de referência) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>

<script src="js/ui.js"></script>
<script src="js/firebase.js"></script>
<script src="js/permissoes.js"></script>
<script src="js/log.js"></script>
<script src="js/sessao.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
<!-- carrega os módulos e depois liga o app (CW.iniciar) -->
<script src="modulos/lista.js"></script>
</body>
</html>
