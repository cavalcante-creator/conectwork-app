<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conectwork</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#081638;--navy2:#0D2152;--blue:#1763E6;--blue2:#2F7BFF;--cyan:#18C5F0;
  --grad:linear-gradient(120deg,#1452D4 0%,#1E74F0 55%,#18C5F0 100%);
  --bg:#F0F3F9;--surface:#FFFFFF;--surface2:#F6F8FC;--ink:#0A1838;--muted:#5E6A88;--faint:#8F9AB5;--line:#E1E7F1;
  --ok:#0A7B55;--okbg:#DEF5EA;--warn:#9A5B00;--warnbg:#FFF0D6;--info:#1450C0;--infobg:#E3ECFE;--danger:#B42D24;--dangerbg:#FCE8E6;
  --shadow:0 1px 2px rgba(8,22,56,.04),0 6px 20px -12px rgba(8,22,56,.14);
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050D24;--surface:#0C1A3B;--surface2:#112249;--ink:#E8EEFC;--muted:#9EACCB;--faint:#6F7FA4;--line:#1E3060;
  --ok:#63D8A6;--okbg:#0B3326;--warn:#F4BC66;--warnbg:#38290C;--info:#8DB8FF;--infobg:#132C64;--danger:#FF8C82;--dangerbg:#3C1511;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050D24;--surface:#0C1A3B;--surface2:#112249;--ink:#E8EEFC;--muted:#9EACCB;--faint:#6F7FA4;--line:#1E3060;
  --ok:#63D8A6;--okbg:#0B3326;--warn:#F4BC66;--warnbg:#38290C;--info:#8DB8FF;--infobg:#132C64;--danger:#FF8C82;--dangerbg:#3C1511;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{letter-spacing:-.015em}

/* ---------- Login ---------- */
.login{display:grid;grid-template-columns:minmax(380px,42%) 1fr;min-height:100%}
.brandpanel{position:relative;overflow:hidden;background:var(--navy);color:#fff;padding:48px 52px;display:flex;flex-direction:column}
.curves{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.brandpanel h1{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05;margin:26px 0 12px}
.brandpanel h1 span,.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brandpanel .slogan{letter-spacing:.3em;font-size:11.5px;color:#9DB1E0;font-weight:500}
.brandpanel .lead{color:#B8C7EA;max-width:40ch;margin:28px 0 0;font-size:15px;line-height:1.6}
.pillars{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;margin-top:auto;padding-top:48px;position:relative}
.pillar{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#C5D3F2}
.pillar svg.i{color:var(--cyan);margin-top:1px}
.loginside{padding:48px clamp(20px,5vw,64px);display:flex;flex-direction:column;gap:28px;max-width:860px}
.loginside h2{font-size:24px;margin:0 0 4px;font-weight:600}
.sub{color:var(--muted);margin:0}
.accounts{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.acc{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
.acc:hover{border-color:var(--blue)}
.acc .t{display:flex;flex-direction:column;min-width:0;gap:2px;flex:1}
.acc strong{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc small{color:var(--muted);font-size:12px}
.acc.master{background:var(--navy2);border-color:var(--navy2);color:#fff}
.acc.master small{color:#A9BAE2}
.signup{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px dashed var(--blue);border-radius:16px;padding:20px 22px}
.signup .t{flex:1}
.signup strong{display:block;font-size:15px;font-weight:600}
@media (max-width:860px){.login{grid-template-columns:1fr}.brandpanel{padding:32px 24px}.brandpanel h1{font-size:32px}.pillars,.brandpanel .lead{display:none}.signup{flex-direction:column;align-items:flex-start}}

/* ---------- Shell ---------- */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100%}
.side{background:var(--navy);color:#C8D5F3;display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:22px 16px;overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:19px;letter-spacing:-.01em;padding:0 8px 26px;position:relative}
.navlabel{font-size:11px;color:#6C80B3;padding:0 12px 8px;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:3px;position:relative}
.nav button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 12px;border-radius:10px;color:#AFC0E6;cursor:pointer;text-align:left;font-weight:500;position:relative}
.nav button:hover{background:rgba(255,255,255,.05);color:#fff}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(47,123,255,.28),rgba(24,197,240,.06));color:#fff}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--cyan)}
.nav .badge{margin-left:auto;background:var(--cyan);color:var(--navy);font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px}
.usercard{margin-top:auto;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px;position:relative}
.usercard .t{min-width:0;flex:1}
.usercard strong{display:block;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.usercard small{color:#8FA3D3;font-size:11.5px}
.iconbtn{background:none;border:0;color:#AFC0E6;cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center}
.iconbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.content{min-width:0;display:flex;flex-direction:column}
.appbar{display:flex;align-items:center;gap:12px;padding:14px clamp(18px,3.5vw,40px);border-bottom:1px solid var(--line);background:var(--surface)}
.crumbs{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);min-width:0}
.crumbs b{color:var(--ink);font-weight:500}
.crumbs svg.i{width:14px;height:14px;color:var(--faint)}
.env{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--warn);background:var(--warnbg);padding:4px 10px;border-radius:999px;white-space:nowrap}
.env::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.topbar{display:flex;align-items:flex-end;gap:16px;padding:24px clamp(18px,3.5vw,40px) 0;flex-wrap:wrap}
.topbar h1{font-size:24px;margin:0;font-weight:600;line-height:1.2}
.topbar .sub{font-size:13.5px;margin-top:4px}
.topbar .grow{flex:1;min-width:240px}
main{padding:22px clamp(18px,3.5vw,40px) 48px;display:flex;flex-direction:column;gap:22px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:6px;z-index:20}
  .side .curves,.navlabel{display:none}
  .logo{padding:0 4px 0 2px;font-size:0;gap:0}
  .nav{flex-direction:row;overflow-x:auto;flex:1;scrollbar-width:none}
  .nav button{padding:9px 11px;white-space:nowrap;font-size:13px}
  .nav button[aria-current="page"]::before{display:none}
  .usercard{margin:0;padding:4px;background:none;border:0}
  .usercard .t,.usercard .avatar{display:none}
  .env{display:none}
}

/* ---------- Componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h3{margin:0;font-size:14.5px;font-weight:600}
.card-h .ic{width:30px;height:30px;border-radius:9px;background:var(--infobg);color:var(--info);display:grid;place-items:center}
.card-h .ic svg.i{width:16px;height:16px}
.card-h .count{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:999px;padding:1px 8px}
.card-h .end{margin-left:auto}
.card-b{padding:18px 20px}
.grid-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
@media (max-width:1100px){.grid-main{grid-template-columns:1fr}}
@media (max-width:820px){.grid-2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:22px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:500;cursor:pointer;background:var(--blue);color:#fff;white-space:nowrap;box-shadow:0 6px 16px -8px rgba(23,99,230,.7);text-decoration:none}
.btn:hover{background:var(--blue2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sec:hover{background:var(--surface2)}
.btn.ok{background:var(--ok);color:#fff;box-shadow:none}
.btn.warn{background:var(--warnbg);color:var(--warn);box-shadow:none}
.btn.dangerous{background:var(--dangerbg);color:var(--danger);box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;padding:8px 10px}
.btn.ghost:hover{color:var(--danger);background:var(--dangerbg)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn.light{background:#fff;color:var(--navy);box-shadow:none}
.btn.light:hover{background:#E8F0FF}
.btn.glass{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:none}
.linkbtn{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;font-weight:500;display:inline-flex;align-items:center;gap:6px}

.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--navy2);color:#fff;padding:26px 28px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;box-shadow:0 20px 40px -24px rgba(8,22,56,.7)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 140% at 100% 0%,rgba(24,197,240,.32) 0%,rgba(23,99,230,.22) 30%,transparent 60%);pointer-events:none}
.hero .lbl{font-size:13px;color:#A9BEEA}
.hero .big{font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:6px 0 4px}
.hero .note{font-size:13px;color:#C2D0F0}
.hero .cta{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;position:relative}
.hero .splits{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center;position:relative}
.split{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:13px 15px}
.split span{font-size:12px;color:#A9BEEA;display:block}
.split strong{font-size:18px;font-weight:600}
.split em{font-style:normal;font-size:12px;color:#7FE3FF}
@media (max-width:760px){.hero{grid-template-columns:1fr;padding:22px}.hero .big{font-size:32px}}

.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;flex:none;letter-spacing:.02em}
.avatar.sm{width:28px;height:28px;font-size:10.5px;border-radius:8px}
.avatar.lg{width:56px;height:56px;font-size:18px;border-radius:16px}
.pair{display:inline-flex;align-items:center}
.pair .avatar+.avatar{margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--infobg);color:var(--info);white-space:nowrap}
.tag svg.i{width:12px;height:12px}
.tag.gray{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--okbg);color:var(--ok)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.pill.info{background:var(--infobg);color:var(--info)}
.pill.danger{background:var(--dangerbg);color:var(--danger)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy2);border-color:var(--navy2);color:#fff}
.chip b{font-weight:600;margin-left:4px;opacity:.75}
.empty{padding:40px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ic{width:50px;height:50px;border-radius:15px;background:var(--infobg);color:var(--info);display:grid;place-items:center}

/* Tabela */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
th:first-child,td:first-child{padding-left:20px}
th:last-child,td:last-child{padding-right:20px}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.r{text-align:right}
.cell{display:flex;align-items:center;gap:12px;min-width:0}
.cell strong{display:block;font-weight:600}
.cell small{display:block;color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.prog{display:inline-flex;gap:3px;margin-top:6px}
.prog i{width:18px;height:4px;border-radius:2px;background:var(--line)}
.prog i.on{background:var(--grad)}
.acts{display:flex;gap:6px;justify-content:flex-end}
@media (max-width:760px){
  table.resp thead{display:none}
  table.resp tr{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  table.resp tbody tr:last-child{border-bottom:0}
  table.resp td{border:0;padding:0!important}
  table.resp td.m-hide{display:none}
  table.resp td.m-full{grid-column:1/-1}
  table.resp .acts{justify-content:flex-start}
}

/* Trilha */
.trail{display:flex;align-items:center}
.step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.dot svg{width:10px;height:10px}
.done .dot,.step.done .dot{background:var(--grad);border-color:transparent;color:#fff}
.step.done{color:var(--muted)}
.step.now{color:var(--ink);font-weight:500}
.step.now .dot{border-color:var(--blue);box-shadow:0 0 0 4px var(--infobg)}
.link{flex:1;height:2px;background:var(--line);margin:0 8px;min-width:14px}
.link.done{background:var(--grad)}

.todo{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.todo .ic.warn{background:var(--warnbg);color:var(--warn)}
.todo .ic.info{background:var(--infobg);color:var(--info)}
.todo .t{flex:1;min-width:0}
.todo strong{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo small{color:var(--muted);font-size:12px}
.feed{list-style:none;margin:0;padding:6px 20px 16px}
.feed li{display:grid;grid-template-columns:14px 1fr;gap:12px;padding:10px 0;position:relative}
.feed li::before{content:"";position:absolute;left:6px;top:24px;bottom:-10px;width:2px;background:var(--line)}
.feed li:last-child::before{display:none}
.feed .b{width:14px;height:14px;border-radius:50%;margin-top:4px;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--blue)}
.feed .b.ok{box-shadow:0 0 0 2px var(--ok)}
.feed .b.warn{box-shadow:0 0 0 2px var(--warn)}
.feed .b.danger{box-shadow:0 0 0 2px var(--danger)}
.feed p{margin:0;font-size:13px}
.feed small{color:var(--faint);font-size:11.5px}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar .col{width:100%;max-width:46px;border-radius:9px 9px 4px 4px;background:var(--grad);min-height:4px}
.bar .col.mute{background:var(--line)}
.bar span{font-size:11.5px;color:var(--muted)}
.bar b{font-size:11.5px;font-weight:600}
.chain{display:flex;align-items:center;padding:8px 0;overflow-x:auto}
.node{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:120px;text-align:center}
.node strong{font-size:13px;font-weight:600}
.node small{font-size:11.5px;color:var(--muted)}
.edge{flex:1;min-width:90px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.edge .ln{width:100%;height:2px;background:var(--grad);position:relative}
.edge .ln::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--cyan);border-right:0}
.edge b{color:var(--ink);font-weight:600}

/* ---------- Formulários ---------- */
.fgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px 16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
@media (max-width:720px){.c3,.c4,.c5{grid-column:span 6}.c6,.c8,.c9{grid-column:span 12}}
label.f{display:flex;flex-direction:column;gap:6px;min-width:0}
label.f>span{font-size:12.5px;color:var(--muted);font-weight:500}
label.f>span i{font-style:normal;color:var(--faint);font-weight:400}
label.f>span b{color:var(--danger);font-weight:500}
label.f input,label.f select,label.f textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--ink);font-size:14px}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px var(--infobg)}
label.f.has-err input,label.f.has-err select{border-color:var(--danger)}
label.f em{font-style:normal;font-size:12px}
.ferr{color:var(--danger)}
.hint{color:var(--faint)}
.err{color:var(--danger);font-size:13px;margin:0;min-height:1.2em}
.fsec{font-size:13px;font-weight:600;color:var(--ink);grid-column:1/-1;padding-top:6px;display:flex;align-items:center;gap:10px}
.fsec::after{content:"";flex:1;height:1px;background:var(--line)}
.optc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.optc{grid-template-columns:1fr}}
.opt{display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:16px;cursor:pointer;position:relative}

.up{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

.up.ok .ic{background:var(--okbg);color:var(--ok)}
.up .t{flex:1;min-width:0}
.up strong{display:block;font-weight:600;font-size:13.5px}
.up small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.up label.btn{cursor:pointer}

@media (max-width:900px){

}

/* API */

dialog{border:0;border-radius:20px;padding:0;max-width:600px;width:calc(100% - 28px);background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(5,13,36,.6)}

.ringbox{position:relative;width:132px;height:132px;flex:none}

.bar2{display:flex;flex-direction:column;gap:6px}.bar2 .l{display:flex;justify-content:space-between;gap:12px;font-size:13px}

.rev{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}.rev:last-child{border-bottom:0}
.rev .rh{display:flex;gap:10px;align-items:center}.rev .rh .t{flex:1;min-width:0}.rev strong{font-weight:600;font-size:13.5px;display:block}.rev small{color:var(--muted);font-size:12px}.rev p{margin:0;font-size:13.5px}
.crit{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.crit b{color:var(--ink)}
.rresp{background:var(--surface2);border-left:3px solid var(--blue);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px}.rresp strong{display:block;font-size:12px;margin-bottom:2px}

.meter{height:10px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;margin-top:14px;max-width:420px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#18C5F0,#7FE3FF);border-radius:5px}

.zapbtn:hover{background:#D2F0DE}.zapbtn b{background:#1FA855;color:#fff;border-radius:999px;padding:0 6px;font-size:11px}.zapbtn svg.i{width:16px;height:16px}

.ph{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.04em;padding:1px 6px;border-radius:6px;background:rgba(24,197,240,.15);color:#7FE3FF}

function validCNPJ(v){ const c=dig(v); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;

  return calc(12)==c[12]&&calc(13)==c[13]; }
function validCPF(v){ const c=dig(v); if(c.length!==11||/^(\d)\1+$/.test(c)) return false;
  const calc=n=>{ let s=0; for(let i=0;i<n;i++) s+=c[i]*(n+1-i); const r=s*10%11; return r===10?0:r; };

function validate(s){
  const d=wiz.data, e={}, req=(p,m)=>{ if(!String(getP(d,p)||'').trim()) e[p]=m||'Campo obrigatório.'; };
  if(s===0){
    if(!d.tipo) e.tipo='Escolha como a empresa vai usar o Conectwork.';
    if(!validCNPJ(d.dados.cnpj)) e['dados.cnpj']=dig(d.dados.cnpj).length?'CNPJ inválido. Confira os números.':'Informe o CNPJ.';
    else if(db.empresas.some(x=>x.id!==wiz.editId&&dig(x.dados.cnpj)===dig(d.dados.cnpj))) e['dados.cnpj']='Este CNPJ já tem cadastro no Conectwork.';
    req('dados.abertura','Informe a data de abertura.'); req('dados.porte','Selecione o porte.');
    req('dados.razao','Informe a razão social.'); req('dados.fantasia','Informe o nome fantasia.');
    req('dados.regime','Selecione o regime tributário.'); req('dados.cnae','Informe o CNAE principal.');
    if(d.tipo&&d.tipo!=='contratante') req('dados.im','Informe a inscrição municipal.');
    if(d.dados.porte==='MEI'&&d.dados.regime&&d.dados.regime!=='MEI (SIMEI)') e['dados.regime']='Empresas MEI usam o regime MEI (SIMEI).';
  }
  if(s===1){ if(dig(d.end.cep).length!==8) e['end.cep']='CEP precisa ter 8 dígitos.'; ['logradouro','numero','bairro','cidade'].forEach(k=>req('end.'+k)); req('end.uf','Selecione a UF.'); }
  if(s===2){
    req('resp.nome','Informe o nome completo.'); if(!validCPF(d.resp.cpf)) e['resp.cpf']=dig(d.resp.cpf).length?'CPF inválido. Confira os números.':'Informe o CPF.';
    req('resp.cargo','Informe o cargo.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.resp.email||'')) e['resp.email']='Informe um e-mail válido.';
    if(d.resp.emailFin&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.resp.emailFin)) e['resp.emailFin']='E-mail inválido.';
    if(dig(d.resp.cel).length<10) e['resp.cel']='Informe o celular com DDD.';
  }
  if(s===3){ req('banco.banco','Selecione o banco.'); req('banco.tipoConta','Selecione o tipo de conta.');
    if(dig(d.banco.agencia).length<4) e['banco.agencia']='Agência com 4 dígitos.'; if(dig(d.banco.conta).length<4) e['banco.conta']='Informe a conta com dígito.';
    req('banco.pixTipo','Selecione o tipo de chave.'); req('banco.pix','Informe a chave Pix.'); }
  if(s===4){ docsReq(d).forEach(([k,l,r])=>{ if(r&&!d.docs?.[k]) e['docs.'+k]='Documento obrigatório.'; }); }
  if(s===5){ ['verdade','termos','lgpd'].forEach(k=>{ if(!d.aceite?.[k]) e['aceite.'+k]=1; }); }
  return e;
}

function bindWizard(){
  document.querySelectorAll('[data-p]').forEach(el=>{
    const h=()=>{ let v=el.value; if(el.dataset.mask){ v=MASK[el.dataset.mask](v); el.value=v; } setP(wiz.data,el.dataset.p,v);
      if(wiz.err[el.dataset.p]){ delete wiz.err[el.dataset.p]; const l=el.closest('label'); l.classList.remove('has-err'); const m=l.querySelector('.ferr'); if(m) m.remove(); } };
    el.oninput=h; el.onchange=h; });
  document.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{ wiz.data.tipo=b.dataset.tipo; delete wiz.err.tipo; renderWizard(); });
  document.querySelectorAll('[data-doc]').forEach(f=>f.onchange=()=>{ const file=f.files[0]; if(!file) return;
    if(file.size>10e6){ wiz.err['docs.'+f.dataset.doc]='Arquivo maior que 10 MB.'; renderWizard(); return; }
    wiz.data.docs=wiz.data.docs||{}; wiz.data.docs[f.dataset.doc]={nome:file.name,tam:file.size}; delete wiz.err['docs.'+f.dataset.doc]; renderWizard(); });
  document.querySelectorAll('[data-aceite]').forEach(c=>c.onchange=()=>{ wiz.data.aceite[c.dataset.aceite]=c.checked; delete wiz.err['aceite.'+c.dataset.aceite]; c.closest('label').classList.remove('has-err'); });

function chartCard(){

/* ===================== Ações ===================== */
function doAct(act,id){
  const c=db.cobrancas.find(x=>x.id===id);
  if(act==='nova') dlgNova();
  else if(act==='emitir') dlgEmitir(c);
  else if(act==='pagar') dlgPagar(c);
  else if(act==='recusar') dlgRecusar(c);
  else if(act==='cancelar'){ db.cobrancas=db.cobrancas.filter(x=>x.id!==id); save(); toast(`Cobrança ${id} cancelada.`); render(); }
  else if(act==='api'){
    const val=parseValor($('#aVal').value), desc=$('#aDesc').value.trim(), pr=$('#aPrest').value;
    if(!pr){ $('#aErr').textContent='Nenhum prestador aprovado para receber a cobrança.'; return; }
    if(val<=0){ $('#aErr').textContent='Informe o valor fechado pelo RH.'; return; }
    if(!desc){ $('#aErr').textContent='Informe a descrição do serviço.'; return; }
    const n={id:'C-'+(db.seq++),contratante:session,prestador:pr,descricao:desc,valor:val,competencia:$('#aComp').value,status:'aguardando',origem:'api',criada:hoje()};
    db.cobrancas.push(n); zapCob(n,'nova'); (db.apiLog||=[]).unshift({em:agora(),competencia:n.competencia,valor:val,cobranca:n.id});
    save(); toast(`Fechamento recebido. Cobrança ${n.id} criada para ${nome(pr)}.`); render();
  }
}
function decide(kind){
  const e=emp(revId), taxa=Number($('#rTaxa')?.value);
  if(kind==='taxa'){ if(!isFinite(taxa)||taxa<0) return; e.taxa=taxa; e.historico.push({em:hoje(),txt:`Taxa ajustada para ${taxa.toLocaleString('pt-BR')}%`}); save(); toast(`Taxa de ${nome(e.id)} ajustada.`); render(); return; }
  if(kind==='aprovar'){ e.modulos=(e.modulos&&e.modulos.length)?e.modulos:(e.tipo==='prestador'?['cobrancas','conta']:['cobrancas','equipe']); e.status='aprovado'; e.taxa=isFinite(taxa)?taxa:e.taxa; e.avaliadoEm=hoje(); e.motivo=''; e.historico.push({em:hoje(),txt:'Cadastro aprovado'}); save(); toast(`${nome(e.id)} aprovada e liberada na rede.`); render(); return; }
  const m=$('#rMotivo').value.trim();
  if(!m){ $('#rErr').textContent='Escreva o motivo. Ele aparece para a empresa.'; $('#rMotivo').focus(); return; }
  e.motivo=m; e.avaliadoEm=hoje();
  if(kind==='ajuste'){ e.status='pendencia'; e.historico.push({em:hoje(),txt:'Ajuste solicitado pela equipe'}); toast(`Ajuste solicitado a ${nome(e.id)}.`); }
  else { e.status='recusado'; e.historico.push({em:hoje(),txt:'Cadastro recusado'}); toast(`Cadastro de ${nome(e.id)} recusado.`); }
  save(); render();
}

const TAB_MOD={pagar:'cobrancas',receber:'cobrancas',api:'integracao',usuarios:'equipe',profissionais:'profissionais',catalogo:'catalogo',conta:'conta'};

const avatarTxt=(n,cls='')=>{ let h=0; for(const ch of n) h=(h*31+ch.charCodeAt(0))>>>0; return `<span class="avatar ${cls}" style="background:${GRADS[h%GRADS.length]}" aria-hidden="true">${esc(iniciais(n))}</span>`; };
const faseBanner=(n,t)=>`<div class="banner info"><span class="ph2" style="margin-top:1px">Fase ${n}</span><span>${t}</span></div>`;

function cargoBase(k,u){ const c=CARGOS[u.cargo]; return !c||c.tabs==='*'||c.tabs.includes(k); }
function cargoOk(k,u){ if(!u) return true; if((u.extras||[]).includes(k)) return true; if((u.sem||[]).includes(k)) return false; return cargoBase(k,u); }
function tabsEmpresa(e){
  const t=e.tipo, all=[['inicio','Visão geral','home']];
  if(t!=='contratante') all.push(['receber',t==='prestador'?'Notas a emitir':'A receber',t==='prestador'?'receipt':'inbox']);
  if(t==='prestador') all.push(['mei','Minha área MEI','star'],['curriculo','Meu currículo','user']);
  if(t!=='prestador') all.push(['pagar',t==='contratante'?'Cobranças a pagar':'A pagar','wallet'],['api','Integração RH','plug']);
  if(t==='ambos') all.push(['profissionais','Profissionais','user']);
  if(t!=='prestador') all.push(['catalogo','Catálogo','search']);
  all.push(['conta','Conta e benefícios','bank']);
  if(t!=='prestador') all.push(['usuarios','Usuários e acessos','users']);
  if(t!=='prestador') all.push(['relatorios','Relatórios','file'],['auditoria','Histórico de alterações','clock']); else all.push(['relatorios','Relatórios','file']);
  all.push(['empresa','Minha empresa','building']);
  return all.filter(([k])=>!TAB_MOD[k]||temMod(e,TAB_MOD[k]));
}
function tabsFor(u){
  u=u||usr();
  const sid=u?u.empresa:session;
  if(sid==='master') return [['inicio','Visão geral','home'],['cadastros','Cadastros','users'],['todas','Cobranças','list'],['auditoria','Histórico de alterações','clock'],['roadmap','Roadmap do produto','star']];
  const e=emp(sid); if(!e) return [['inicio','Visão geral','home']];
  if(e.status!=='aprovado') return [['status','Meu cadastro','file']];
  return tabsEmpresa(e).filter(([k])=>k==='inicio'||cargoOk(k,u));
}

let perfilId=null, ringN=0;
const CRIT=[['q','Qualidade'],['s','Segurança'],['p','Pontualidade'],['c','Comunicação']];
const LIMITE_MEI=81000;
const diasAte=d=>Math.round((new Date(d+'T12:00:00')-new Date(hoje()+'T12:00:00'))/864e5);
function docSt(d){ const n=diasAte(d.validade); return n<0?['danger','Vencido']:n<=30?['warn','Vence em '+n+(n===1?' dia':' dias')]:['ok','Em dia']; }
const avalsDe=p=>(db.avaliacoes||[]).filter(a=>a.pessoa===p.id).sort((a,b)=>b.data.localeCompare(a.data));
const mediaAv=a=>(a.n.q+a.n.s+a.n.p+a.n.c)/4;
const fmt1=v=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
function rep(p){
  const av=avalsDe(p), st=p.st||{tot:0,prazo:0,prim:0}, docs=p.docs||[];
  const media=av.length?av.reduce((s,a)=>s+mediaAv(a),0)/av.length:null;
  const prazo=st.tot?st.prazo/st.tot:0, prim=st.tot?st.prim/st.tot:0, dok=docs.length?docs.filter(d=>docSt(d)[0]!=='danger').length/docs.length:0;
  const novo=av.length<3||st.tot<3;
  const indice=novo?null:Math.round(25*prazo+20*prim+15*dok+40*(media/5));
  const anos=p.desde?(new Date(hoje())-new Date(p.desde))/3.156e10:0;
  const selos=[];
  if(docs.length&&docs.every(d=>docSt(d)[0]==='ok')) selos.push(['shield','Documentação em dia']);
  if(st.tot>=5&&prazo===1) selos.push(['clock','Nota sempre no prazo']);
  if(docs.some(d=>d.nome==='NR-10'&&docSt(d)[0]!=='danger')) selos.push(['bolt','NR-10 válida']);
  if(anos>=1) selos.push(['star',Math.floor(anos)+(Math.floor(anos)>1?' anos':' ano')+' na rede']);
  if(media!==null&&av.length>=3&&media>=4.7) selos.push(['hand','Muito bem avaliado']);
  const nInd=(db.indicacoes||[]).filter(i=>i.de===p.id&&i.status==='aceita').length; if(nInd) selos.push(['users','Indicou '+nInd+(nInd>1?' profissionais':' profissional')]);
  return {av,media,prazo,prim,dok,novo,indice,selos,st,anos};
}

let relComp='todas', relModo='pagar';
function relLinhas(){
  const base=relModo==='pagar'?db.cobrancas.filter(c=>c.contratante===session):db.cobrancas.filter(c=>c.prestador===session);
  return base.filter(c=>relComp==='todas'||c.competencia===relComp).sort((a,b)=>b.competencia.localeCompare(a.competencia)||a.id.localeCompare(b.id));
}

  const comps=[...new Set(db.cobrancas.filter(c=>c.contratante===session||c.prestador===session).map(c=>c.competencia))].sort().reverse();
  const ls=relLinhas(), outro=c=>relModo==='pagar'?c.prestador:c.contratante;

    ${ls.length?`<div class="scroll"><table><thead><tr><th>Competência</th><th>Cobrança</th><th>${relModo==='pagar'?'Prestador':'Tomador'}</th><th>Nota</th><th class="r">Valor</th><th>Situação</th><th>Pago em</th></tr></thead><tbody>${ls.map(c=>`<tr><td>${fmtComp(c.competencia)}</td><td>${esc(c.id)}</td><td>${esc(nome(outro(c)))}</td><td>${c.nota?'nº '+c.nota.numero:'—'}</td><td class="r num">${brl(c.valor)}</td><td>${sit(c)}</td><td>${c.pagaEm?fmtData(c.pagaEm):'—'}</td></tr>`).join('')}

}
function baixarCSV(){
  const ls=relLinhas(), outro=c=>relModo==='pagar'?c.prestador:c.contratante, f=v=>Number(v||0).toFixed(2).replace('.',',');
  const linhas=[['Competência','Cobrança',relModo==='pagar'?'Prestador':'Tomador','CNPJ','Nota','Descrição','Valor','Taxa Conectwork','Situação','Pago em']]
    .concat(ls.map(c=>[fmtComp(c.competencia),c.id,nome(outro(c)),emp(outro(c)).dados.cnpj,c.nota?c.nota.numero:'',c.descricao,f(c.valor),f(c.taxaValor),c.status==='paga'?'Paga':c.status==='nota'?'Nota conferida':'Aguardando nota',c.pagaEm?fmtData(c.pagaEm):'']));
  const csv='\ufeff'+linhas.map(l=>l.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=`conectwork-${relModo}-${relComp}.csv`; document.body.appendChild(a); a.click(); a.remove(); toast('Relatório exportado para Excel.'); }
  catch(e){ toast('Não foi possível baixar aqui. Na versão publicada no GitHub o download funciona.'); }
}

const encDe=pid=>(db.encerramentos||[]).find(e=>e.pessoa===pid&&e.status!=='concluido');
function encCard(){
  const ps=(db.pessoas||[]).filter(p=>p.alocado===session&&!encDe(p.id));
  return `<div class="card"><div class="card-h"><span class="ic">${ic('x')}</span><h3>Encerramento de contrato</h3></div><div class="card-b fgrid">
    <p class="c12 hint" style="margin:0;font-size:12.5px">Quando o serviço de um profissional termina, o RH fecha o valor final aqui. A intermediária recebe a cobrança e pede a nota final do profissional.</p>
    ${ps.length?`<label class="f c12"><span>Profissional</span><select id="enP">${ps.map(p=>`<option value="${p.id}">${esc(p.nome)} · ${esc(p.funcao)} · ${esc(nome(p.vinculo))}</option>`).join('')}</select></label>
    <label class="f c6"><span>Último dia de serviço</span><input id="enD" type="date" value="${hoje()}"></label>
    <label class="f c6"><span>Valor final (R$)</span><input id="enV" inputmode="decimal" placeholder="1.850,00"></label>
    <label class="f c12"><span>Motivo</span><select id="enM">${MOT_ENC.map(m=>`<option>${m}</option>`).join('')}</select></label>
    <label class="f c12"><span>Como o valor foi calculado <i>(opcional)</i></span><textarea id="enO" rows="2" placeholder="Ex.: serviços de 01 a 12/11 conforme medição, sem pendências."></textarea></label>
    <p class="err c12" id="enErr"></p>
    <button class="btn c12" data-enc>${ic('send')}Enviar encerramento</button>`:`<div class="c12 empty" style="padding:16px">Nenhum profissional alocado na empresa no momento.</div>`}
  </div></div>`;
}
function enviarEnc(){
  const p=pes($('#enP').value), d=$('#enD').value, v=parseValor($('#enV').value), m=$('#enM').value, o=$('#enO').value.trim(), err=t=>$('#enErr').textContent=t;
  if(!d) return err('Informe o último dia de serviço.');
  if(v<=0) return err('Informe o valor final do serviço.');
  const c={id:'C-'+(db.seq++),contratante:session,prestador:p.vinculo,descricao:`Encerramento · ${p.nome} (serviço até ${fmtData(d).slice(0,5)})`,valor:v,competencia:d.slice(0,7),status:'aguardando',origem:'api',criada:hoje(),tipo:'encerramento',pessoa:p.id};
  db.cobrancas.push(c);
  (db.encerramentos||(db.encerramentos=[])).push({id:'E'+Date.now(),pessoa:p.id,contratante:session,fornecedor:p.vinculo,data:d,motivo:m,obs:o,valor:v,cobranca:c.id,status:'aberto',criada:hoje()});
  p.encerra={cliente:session,data:d,motivo:m};
  (db.apiLog||(db.apiLog=[])).unshift({em:agora(),competencia:c.competencia,valor:v,cobranca:c.id});
  zap(p.vinculo,`A ${nome(session)} encerrou o serviço de ${p.nome} em ${fmtData(d)} (${m}). A cobrança final de ${brl(v)} está no app; peça a nota final do profissional: ${LINK_APP}`,'Encerramento');
  save(); toast(`Encerramento de ${p.nome} enviado para a ${nome(p.vinculo)}.`); render();
}
function todoEnc(it){
  (db.encerramentos||[]).filter(e=>e.fornecedor===session&&!e.repasse).forEach(e=>{ const p=pes(e.pessoa);
    it.push(`<div class="todo"><span class="ic warn">${ic('x')}</span><div class="t"><strong>Encerramento de ${esc(p.nome)} na ${esc(nome(e.contratante))}</strong><small>Último dia ${fmtData(e.data)} · ${esc(e.motivo)} · cobrar a nota final</small></div><button class="btn sm" data-encrep="${e.id}">Cobrar nota final</button></div>`); });
  (db.encerramentos||[]).filter(e=>e.contratante===session).forEach(e=>{ const p=pes(e.pessoa);
    if(!(db.avaliacoes||[]).some(a=>a.pessoa===p.id&&a.de===session&&a.data>=e.criada)) it.push(`<div class="todo"><span class="ic info">${ic('star')}</span><div class="t"><strong>Avaliação final de ${esc(p.nome)}</strong><small>Fecha o histórico dele na ${esc(nome(session))} e conta para o currículo</small></div><button class="btn sm" data-aval="${p.id}">Avaliar</button></div>`); });
}
function dlgEncRep(e){ const p=pes(e.pessoa);
  openDlg(head(`Nota final de ${esc(p.nome.split(' ')[0])}`,`O serviço na ${esc(nome(e.contratante))} termina em ${fmtData(e.data)}. ${p.mei?'O profissional recebe o pedido da nota final.':'Este profissional ainda não tem login; o valor fica registrado para pagamento.'}`)+`<div class="dlg-b">
    <div class="summary">${avatarTxt(p.nome,'sm')}<div class="t"><strong>${esc(p.nome)}</strong><small>${esc(e.motivo)}${e.obs?' · '+esc(e.obs):''}</small></div><div class="v" style="font-size:15px">${brl(e.valor)}<br><small class="hint" style="font-size:11px;font-weight:400">cobrado da ${esc(nome(e.contratante))}</small></div></div>
    <div class="fgrid"><label class="f c6"><span>Valor a pagar ao profissional (R$)</span><input id="erV" inputmode="decimal"></label>
    <label class="f c6"><span>Competência</span><input id="erC" type="month" value="${e.data.slice(0,7)}"></label>
    <label class="f c12"><span>Descrição</span><input id="erD" value="Serviço final na ${esc(nome(e.contratante))} até ${fmtData(e.data)}"></label></div><p class="err" id="erErr"></p></div>
    <div class="dlg-f"><button class="btn sec" data-close>Voltar</button><button class="btn" id="erOk">${ic('send')}${p.mei?'Pedir nota final':'Registrar valor'}</button></div>`);
  $('#erOk').onclick=()=>{ const v=parseValor($('#erV').value), dsc=$('#erD').value.trim();
    if(v<=0){ $('#erErr').textContent='Informe o valor a pagar ao profissional.'; return; }
    if(!dsc){ $('#erErr').textContent='Informe a descrição do serviço.'; return; }
    if(p.mei){ const c={id:'C-'+(db.seq++),contratante:session,prestador:p.mei,descricao:dsc,valor:v,competencia:$('#erC').value,status:'aguardando',origem:'manual',criada:hoje(),tipo:'encerramento',pessoa:p.id};
      db.cobrancas.push(c); e.repasse=c.id;
      zap(p.mei,`Seu serviço na ${nome(e.contratante)} termina em ${fmtData(e.data)}. A ${nome(session)} pediu a nota final de ${brl(v)}. Envie pelo app: ${LINK_APP}`,'Encerramento'); }
    else e.repasse='registrado';
    save(); $('#dlg').close(); toast(`Nota final de ${brl(v)} ${p.mei?'pedida a':'registrada para'} ${p.nome}.`); render(); };
}
const __zapCob=zapCob;
zapCob=function(c,ev){ __zapCob(c,ev);
  if(ev==='paga'&&c.tipo==='encerramento'){ const e=(db.encerramentos||[]).find(x=>x.cobranca===c.id); if(e&&e.status!=='concluido'){ const p=pes(e.pessoa);
    p.alocado=''; p.encerra=null; (p.hist||(p.hist=[])).push({cliente:e.contratante,fim:e.data,motivo:e.motivo}); e.status='concluido';
    zap(e.fornecedor,`O encerramento de ${p.nome} na ${nome(e.contratante)} foi concluído e pago. ${p.nome.split(' ')[0]} aparece como disponível nos seus profissionais.`,'Encerramento'); } } };
function bind7(){
  const q=s=>document.querySelectorAll(s);
  q('[data-enc]').forEach(b=>b.onclick=enviarEnc);
  q('[data-encrep]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); dlgEncRep(db.encerramentos.find(x=>x.id===b.dataset.encrep)); });
  const ev=$('#enV'); if(ev) ev.oninput=()=>$('#enErr').textContent='';
}

load(); try{ uid=localStorage.getItem(KEY+':u')||null; }catch(e){ uid=null; } { const u=usr(); session=u?u.empresa:null; } render();
</script>
</body>
</html>
